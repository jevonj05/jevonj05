{% extends "base.html" %}
{% set title = "Set Budget | Student Budgeting App" %}

{% block content %}
<div class="topbar">
  <div>
    <div class="eyebrow">Budget Setup</div>
    <h1 class="title">Set Monthly Budget</h1>
    <p class="subtitle">Enter your income and spending limit for the month.</p>
  </div>
</div>

<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label>Month</label>
      <input type="month" name="month" value="{{ current_month }}" required>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Monthly Income</label>
        <input type="number" step="0.01" name="income" placeholder="Example: 800" required>
      </div>

      <div class="form-group">
        <label>Spending Budget</label>
        <input type="number" step="0.01" name="budget_limit" placeholder="Example: 300" required>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Save Budget</button>
      <a class="btn btn-ghost" href="/dashboard">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
