<!DOCTYPE html>
<html lang="en">
<head>

  <title>{{ title if title else "Student Budgeting App" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <a href="/dashboard" class="logo">
        BudgetWise
        <span>NSU Student Finance</span>
      </a>

      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/set_budget">Set Budget</a>
      <a class="nav-link" href="/add_expense">Add Expense</a>

      <div class="logout">
